/* ============================================================
   LIVE TOP LEFT INFO
   ============================================================ */

#serverPanel{
    position:absolute;
    z-index:20;
    left:0;
    top:0;

    width:820px;
    max-width:84vw;
    height:144px;

    display:flex;
    align-items:flex-start;

    padding:17px 18px;

    background:
        linear-gradient(
            90deg,
            rgba(169,176,181,.94) 0%,
            rgba(169,176,181,.88) 64%,
            rgba(169,176,181,.50) 80%,
            rgba(169,176,181,0) 100%
        );
}

#mapBox{
    position:relative;

    width:111px;
    height:111px;
    flex:0 0 111px;

    overflow:hidden;

    border:1px solid rgba(0,0,0,.25);
    background:#293137;
}

#mapPreview{
    width:100%;
    height:100%;

    object-fit:cover;
    display:block;
}

#mapFallback{
    position:absolute;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    padding:8px;

    background:linear-gradient(135deg,#3b454b,#20272b);
    color:rgba(255,255,255,.78);

    font-size:11px;
    text-align:center;
    overflow-wrap:anywhere;
}

#serverInfo{
    min-width:0;
    margin-left:14px;
    line-height:1.05;
}

#serverName{
    margin:2px 0 8px;

    max-width:650px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    font-size:29px;
    font-weight:400;
}

#mapName,
#gamemodeName{
    margin:0 0 5px;

    font-size:27px;
    font-weight:400;
}

/* ============================================================
   REAL LOADING PANEL — POPULATED BY GMOD CALLBACKS
   ============================================================ */

#loadingPanel{
    position:absolute;
    z-index:30;

    right:8px;
    bottom:7px;

    width:346px;
    height:66px;

    padding:7px 8px;

    color:#ededed;
    background:rgba(72,72,72,.97);

    border:1px solid rgba(20,20,20,.96);

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 1px 2px rgba(0,0,0,.20);
}

#loadingStatus{
    height:18px;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    line-height:15px;
    font-size:11px;
}

#loadingBottom{
    display:flex;
    align-items:center;

    gap:8px;

    margin-top:4px;
}

#progress{
    flex:1;

    height:22px;

    display:flex;
    gap:2px;

    padding:2px;

    border:1px solid #282828;
    background:#5a5a5a;
}

.segment{
    flex:1;
    height:100%;

    opacity:.22;
    background:#f0f0f0;
}

.segment.on{
    opacity:1;
}

#cancel{
    width:57px;
    height:23px;

    padding:0;

    color:#4b4b4b;
    background:#dedede;

    border:1px solid #595959;

    font:11px Arial,sans-serif;
}

/* ============================================================
   HORROR
   ============================================================ */

#horror{
    position:fixed;
    z-index:1000;

    inset:0;

    display:none;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#000;
}

#horror.show{display:block}

#static{
    position:fixed;
    z-index:1050;

    inset:0;

    display:none;

    pointer-events:none;

    opacity:.16;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.033) 0,
            rgba(255,255,255,.033) 1px,
            rgba(0,0,0,.025) 2px,
            rgba(0,0,0,.025) 4px
        );
}

#static.show{display:block}

#black{
    position:fixed;
    z-index:1200;

    inset:0;

    pointer-events:none;

    opacity:0;

    background:#000;
}

#black.show{opacity:1}

.tear{
    position:fixed;
    z-index:1100;

    left:0;

    width:100%;

    display:none;

    pointer-events:none;

    background:rgba(245,250,255,.11);
}

#tear1{top:17%;height:5vh;transform:translateX(-18px)}
#tear2{top:53%;height:2.3vh;transform:translateX(22px)}
#tear3{top:79%;height:1.4vh;transform:translateX(-10px)}

body.fx1 #base{
    animation:fx1 310ms steps(1,end) infinite;
}

@keyframes fx1{
    0%{transform:translate(0,0)}
    47%{transform:translate(-1px,0)}
    69%{transform:translate(1px,0)}
    100%{transform:translate(0,0)}
}

body.fx2 #base{
    animation:fx2 190ms steps(1,end) infinite;
}
body.fx2 .tear{display:block}
body.fx2 #serverInfo,
body.fx2 #loadingStatus{
    text-shadow:
        2px 0 rgba(255,0,0,.25),
        -2px 0 rgba(0,125,255,.23);
}

@keyframes fx2{
    0%{transform:translate(0,0)}
    24%{transform:translate(-3px,1px)}
    55%{transform:translate(2px,-1px)}
    82%{transform:translate(-1px,1px)}
    100%{transform:translate(0,0)}
}

body.fx3 #base{
    animation:fx3 92ms steps(1,end) infinite;
}
body.fx3 .tear{display:block}
body.fx3 #serverInfo,
body.fx3 #loadingStatus{
    text-shadow:
        3px 0 rgba(255,0,0,.38),
        -3px 0 rgba(0,135,255,.36);
}

@keyframes fx3{
    0%{transform:translate(0,0)}
    18%{transform:translate(-7px,2px)}
    39%{transform:translate(5px,-2px)}
    62%{transform:translate(-3px,1px)}
    82%{transform:translate(5px,2px)}
    100%{transform:translate(0,0)}
}

#audioHint{
    position:fixed;
    z-index:1300;

    top:8px;
    right:10px;

    opacity:0;

    color:rgba(0,0,0,.18);

    font:10px Arial,sans-serif;
}
#audioHint.show{opacity:1}

@media(max-width:1000px){
    #serverPanel{
        width:625px;
        height:124px;
        padding:14px;
    }

    #mapBox{
        width:95px;
        height:95px;
        flex-basis:95px;
    }

    #serverName{font-size:22px}
    #mapName,#gamemodeName{font-size:21px}

    #loadingPanel{
        width:320px;
    }
}
</style>
</head>

    /* ============================================================

    function sanitizeMap(name){
        return String(name || "").replace(/[^a-zA-Z0-9_\-]/g,"");
    }

    function queryParam(name){
        try{
            return new URLSearchParams(location.search).get(name) || "";
        }catch(e){
            return "";
        }
    }

    function showMap(name){
        var clean = sanitizeMap(name);
        if(!clean) return;

        mapName.textContent = clean;

        mapFallback.style.display = "none";
        mapPreview.style.display = "block";

        if(MAPS[clean]){
            mapPreview.onerror = null;
            mapPreview.src = MAPS[clean];
            return;
        }

        var triedPng = false;

        mapPreview.onerror = function(){
            if(!triedPng){
                triedPng = true;
                mapPreview.src = "maps/" + clean + ".png";
                return;
            }

            mapPreview.onerror = null;
            mapPreview.style.display = "none";
            mapFallback.style.display = "flex";
            mapFallback.textContent = clean;
        };

        mapPreview.src = "maps/" + clean + ".jpg";
    }

    showMap(earlyMap || "de_school_night");

    /* ============================================================
       REAL FILE PROGRESS
       ============================================================ */

    var SEGMENT_COUNT = 25;
    var segments = [];

    var filesTotal = 0;
    var filesNeeded = 0;
    var currentFile = "";
    var latestStatus = "Fetching info about workshop addons...";

    for(var i=0; i<SEGMENT_COUNT; i++){
        var seg = document.createElement("div");
        seg.className = "segment";
        progress.appendChild(seg);
        segments.push(seg);
    }

    function completedFiles(){
        if(filesTotal <= 0) return 0;
        return Math.max(0, Math.min(filesTotal, filesTotal - filesNeeded));
    }

    function currentFileNumber(){
        if(filesTotal <= 0) return 0;

        var done = completedFiles();

        if(filesNeeded > 0){
            return Math.min(filesTotal, done + 1);
        }

        return filesTotal;
    }

    function renderProgress(){
        var ratio = 0;

        if(filesTotal > 0){
            ratio = completedFiles() / filesTotal;
        }

        var lit = Math.round(
            Math.max(0, Math.min(1, ratio)) * SEGMENT_COUNT
        );

        for(var i=0; i<segments.length; i++){
            segments[i].className =
                i < lit ? "segment on" : "segment";
        }
    }

    function renderLoadingText(){
        if(filesTotal <= 0){
            loadingStatus.textContent = latestStatus || "Fetching info about workshop addons...";
            return;
        }

        var number = currentFileNumber();

        if(currentFile){
            loadingStatus.textContent =
                number + "/" + filesTotal + " - " + currentFile;
        }else{
            loadingStatus.textContent =
                number + "/" + filesTotal + " - " +
                (latestStatus || "Fetching info about workshop addons...");
        }
    }

    for(var p=0; p<IMAGES.length; p++){

            var pre = new Image();
            pre.onload = function(){ ready[index] = true; };
            pre.src = IMAGES[index];
        })(p);
    }

    function pick(wanted){
        if(ready[wanted]) return wanted;

        for(var i=0; i<ready.length; i++){
            if(ready[i]) return i;
        }

        return wanted;
    }

    music.src = MUSIC;
    music.volume = MUSIC_VOLUME;
    music.muted = false;
    music.loop = false;
    music.preload = "auto";

    var musicStarted = false;
    var fading = false;

    function tryMusic(){
        if(musicStarted) return;

        try{
            music.volume = MUSIC_VOLUME;
            music.muted = false;

            var r = music.play();

            if(r && typeof r.then === "function"){
                r.then(function(){
                    musicStarted = true;
                    audioHint.className = "";
                }).catch(function(){
                    audioHint.className = "show";
                });
            }else{
                setTimeout(function(){
                    if(!music.paused){
                        musicStarted = true;
                        audioHint.className = "";
                    }
                },100);
            }
        }catch(e){
            audioHint.className = "show";
        }
    }

    setTimeout(tryMusic, MUSIC_START);

    var musicRetry = setInterval(function(){
        if(musicStarted){
            clearInterval(musicRetry);
            return;
        }

        if(performance.now() >= MUSIC_START){
            tryMusic();
        }
    },250);

    setTimeout(function(){
        clearInterval(musicRetry);
    },12000);

    document.addEventListener("mousedown", tryMusic);
    document.addEventListener("keydown", tryMusic);

    function fadeMusic(){
        if(fading) return;
        fading = true;

        var start = performance.now();
        var duration = END_TIME - FADE_START;
        var original = music.volume;

        function frame(now){
            var t = (now - start) / duration;

            if(t < 0) t = 0;
            if(t > 1) t = 1;

            try{
                music.volume = original * (1 - t);
            }catch(e){}

            if(t < 1){
                requestAnimationFrame(frame);
            }else{
                try{
                    music.pause();
                    music.currentTime = 0;
                }catch(e){}
            }
        }

        requestAnimationFrame(frame);
    }

    setTimeout(fadeMusic, FADE_START);

        if(level === 2) document.body.classList.add("fx2");
        if(level === 3) document.body.classList.add("fx3");
    }

    function flashBlack(ms){

        }, ms);

    function runEvent(ev){
        var idx = pick(ev.img);

        setFx(ev.fx);

        horror.src = IMAGES[idx];
        horror.className = "show";

        setTimeout(function(){
            horror.className = "";
            staticLayer.className = "";
            setFx(0);

            if(ev.black){
                flashBlack(ev.black);
            }
        }, ev.show);
    }

        staticLayer.className = "";
        black.className = "";
        setFx(0);
    }, END_TIME);

    /* ============================================================
       REAL GMOD CALLBACKS
       ============================================================ */

    window.GameDetails = function(
        realServerName,
        serverurl,
        currentMap,
        maxplayers,
        steamid,
        gamemode,
        volume,
        language
    ){
        if(realServerName){
            serverName.textContent = realServerName;
        }

        if(currentMap){
            showMap(currentMap);
        }

        if(gamemode){
            gamemodeName.textContent = gamemode;
        }

        if(performance.now() >= MUSIC_START){
            tryMusic();
        }
    };

    window.SetFilesTotal = function(total){
        total = Number(total) || 0;

        if(total > 0){
            filesTotal = total;

            if(filesNeeded <= 0 || filesNeeded > filesTotal){
                filesNeeded = filesTotal;
            }

            latestStatus = "Fetching info about workshop addons...";

            renderProgress();
            renderLoadingText();
        }

        if(performance.now() >= MUSIC_START){
            tryMusic();
        }
    };

    window.SetFilesNeeded = function(needed){
        filesNeeded = Math.max(0, Number(needed) || 0);

        renderProgress();
        renderLoadingText();
    };

    window.DownloadingFile = function(fileName){
        currentFile = fileName || "";

        renderLoadingText();
    };

    window.SetStatusChanged = function(status){
        if(status){
            latestStatus = status;
        }

        /*
          When GMod changes phase, the old filename is no longer useful.
        */
        if(status && !/download/i.test(status)){
            currentFile = "";
        }

        renderLoadingText();

        if(performance.now() >= MUSIC_START){
            tryMusic();
        }
    };

})();
</script>

</body>
</html>
